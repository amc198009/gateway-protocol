# Fly.io config for Gateway Protocol reference server.
#
# WebSockets need persistent machines: auto_stop_machines = false and
# min_machines_running = 1. This keeps one machine warm 24/7. With a
# shared-cpu-1x and 256MB, that's roughly $1.94/month of compute.
#
# IMPORTANT — single-machine deployment by design.
# Fly's default is to scale to 2 machines for HA, but this server keeps
# rooms and the feed in IN-MEMORY state. Two machines = split brain:
# POST /feed lands on machine A, GET /feed returns from machine B. The
# `fly scale count 1` invocation enforces single-machine; if you ever
# re-deploy and Fly suggests adding a second machine, decline until you've
# migrated state to Redis (see LAUNCH_CHECKLIST.md §1c).
#
# To deploy:  cd server && fly deploy
# To scale:   fly scale count 1          (single machine; required for in-memory state)
#             fly scale count N + Redis  (multi-instance — requires code migration first)
# To logs:    fly logs -a gateway-protocol

app = "gateway-protocol"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Comma-separated CORS allowlist of browser origins that may read responses.
  # The hosted web app is same-origin (no CORS needed) and the desktop build
  # runs from file:// (Origin: null), which corsOrigin() allows explicitly. Add
  # extra web origins here as needed; "*" restores the old wildcard. No cookies
  # are used, so this is defense-in-depth.
  ALLOW_ORIGIN = "https://gateway-protocol.fly.dev"
  FEED_MAX = "500"

[http_service]
  internal_port = 7070
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

name: Release

# Builds the desktop app for macOS, Windows, and Linux and attaches the
# artifacts to the GitHub Release for the pushed tag.
#
#   Tag a release:   git tag v3.1.0 && git push origin v3.1.0
#   → this workflow builds on four runners and uploads:
#       macOS   .dmg + .zip   (native x64 AND native arm64; files are
#                              arch-suffixed so both attach to one Release)
#       Windows Setup.exe + .nupkg
#       Linux   .deb + .rpm + .zip
#
# workflow_dispatch (manual run) builds the same matrix but only uploads
# the binaries as workflow artifacts — it does NOT touch any Release, so
# you can smoke-test a build without cutting a tag.
#
# All builds are UNSIGNED (Gatekeeper / SmartScreen warnings expected).
# Signing is a separate, paid step — see TODO.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to the Release

jobs:
  build:
    name: Build · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS arches build on Apple Silicon runners (macos-14): the
          # app has no native node modules, so `make --arch=x64` cross-builds a
          # valid Intel .app/.dmg, and arm64 runners are far more available than
          # the scarce Intel (macos-13) pool that previously stalled releases.
          - os: macos-14        # Apple Silicon runner → cross-built x64 .dmg
            platform: macos-x64
            arch: x64
          - os: macos-14        # Apple Silicon runner → native arm64 .dmg
            platform: macos-arm64
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      # maker-deb needs dpkg (present) + fakeroot; maker-rpm needs rpmbuild.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci --no-audit --no-fund

      # appdmg mounts the staging image at /Volumes/Gateway Protocol then
      # detaches it by that exact path. If a stale same-named volume is already
      # mounted, macOS mounts the new one at "…Protocol 1" and the detach fails
      # ("No such file or directory"), breaking `make`. Force-detach leftovers
      # so the volume mounts at the expected path.
      - name: Detach stale Gateway Protocol volumes (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          for v in "/Volumes/Gateway Protocol"*; do
            [ -d "$v" ] && hdiutil detach "$v" -force || true
          done
          exit 0

      - name: Build (electron-forge make · ${{ matrix.arch }})
        working-directory: electron-app
        run: npm run make -- --arch=${{ matrix.arch }}

      # Normalize artifact filenames to stable, space-free names so the
      # Gateway Protocol server can 302 to a fixed
      # `releases/latest/download/<name>` URL (see RELEASE_ASSETS in
      # server/practice-room.js), and so the two macOS arches don't collide as
      # Release assets. Runs on every OS (windows-latest has git-bash).
      - name: Normalize artifact filenames
        shell: bash
        working-directory: electron-app/out/make
        run: |
          ren() { [ -f "$1" ] && mv -f "$1" "$(dirname "$1")/$2" && echo "renamed $1 -> $2"; }
          case "${{ matrix.platform }}" in
            windows)
              find . -name '*.exe' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-Setup.exe"; done
              find . -name '*.zip' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-windows.zip"; done
              ;;
            linux)
              find . -name '*.deb' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-linux-amd64.deb"; done
              find . -name '*.rpm' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-linux-x86_64.rpm"; done
              find . -name '*.zip' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-linux.zip"; done
              ;;
            macos-*)
              find . -name '*.dmg' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-mac-${{ matrix.arch }}.dmg"; done
              find . -name '*.zip' -print0 | while IFS= read -r -d '' f; do ren "$f" "Gateway-Protocol-mac-${{ matrix.arch }}.zip"; done
              ;;
          esac

      - name: List built artifacts
        shell: bash
        run: ls -laR electron-app/out/make || true

      # Always publish the binaries as downloadable workflow artifacts so a
      # manual (workflow_dispatch) run is testable without a Release.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateway-protocol-${{ matrix.platform }}
          path: |
            electron-app/out/make/**/*.dmg
            electron-app/out/make/**/*.zip
            electron-app/out/make/**/*.exe
            electron-app/out/make/**/*.deb
            electron-app/out/make/**/*.rpm
          if-no-files-found: warn

      # On a tag push, attach this platform's binaries to the matching
      # Release (created if it doesn't exist). Each matrix job appends its
      # own files; fail_on_unmatched_files:false because each OS only emits
      # its own artifact types.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-app/out/make/**/*.dmg
            electron-app/out/make/**/*.zip
            electron-app/out/make/**/*.exe
            electron-app/out/make/**/*.deb
            electron-app/out/make/**/*.rpm
          fail_on_unmatched_files: false
